name: Hourly ticket watch

on:
  # The hourly schedule was intentionally removed: GitHub's US runners are
  # blocked by District (HTTP 403), so they must not overwrite fresh snapshots
  # collected by the Indian-egress OpenWrt NAS. This workflow remains as a
  # manual fallback only.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check sources without writing snapshots or sending alerts"
        type: boolean
        default: false
      force:
        description: "Run even if a fresh NAS snapshot exists (may overwrite it with degraded data)"
        type: boolean
        default: false

# One shared group with pages.yml: monitoring writes data and deploys Pages, so
# two runs must never build/deploy at the same time. Queued, never cancelled.
concurrency:
  group: doomsday-watch-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TARGET_BRANCH: master

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 20
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          # Full history keeps the post-run rebase/push reliable if a human push
          # lands while the monitor is running.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install monitor dependencies
        run: pip install -r requirements.txt

      - name: Check for a fresh NAS snapshot
        id: freshness
        env:
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set +e
          if [ "$FORCE" = "true" ] || [ "$DRY_RUN" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path

          meta_path = Path("data/meta.json")
          try:
              meta = json.loads(meta_path.read_text(encoding="utf-8"))
          except (OSError, ValueError):
              sys.exit(1)
          collector = meta.get("collector") or {}
          if collector.get("transport") != "nas_inbox":
              sys.exit(1)
          stamp = meta.get("last_success_at") or collector.get("collected_at")
          try:
              when = datetime.fromisoformat(str(stamp).replace("Z", "+00:00"))
              if when.tzinfo is None:
                  when = when.replace(tzinfo=timezone.utc)
              age = (datetime.now(timezone.utc) - when.astimezone(timezone.utc)).total_seconds() / 60
              print(f"NAS snapshot age: {age:.1f} minutes")
          except (TypeError, ValueError):
              print("NAS provenance present; snapshot age unknown")
          # Any NAS provenance wins: a manual cloud run must use force=true,
          # otherwise its US egress can only produce degraded data.
          sys.exit(0)
          PY
          then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::NAS snapshot provenance is present. Skipping the manual cloud collector to avoid overwriting it. Re-run with force=true to override."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate configuration
        run: python -m doomsday_watch --config config/monitor.json --data data validate
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

      - name: Run hourly snapshot
        id: run
        if: ${{ steps.freshness.outputs.skip != 'true' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DRY_RUN: ${{ inputs.dry_run }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          set -o pipefail
          # Actions invokes bash with -e; we need to inspect non-zero exit codes
          # (3 = every source externally blocked) instead of aborting immediately.
          set +e

          # Global options (--config/--data) come before the subcommand;
          # --dry-run/--github-summary belong to `run`.
          ARGS=(--config config/monitor.json --data data run)
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          ARGS+=(--github-summary)

          rc=1
          for attempt in 1 2; do
            echo "::group::Monitor attempt ${attempt}"
            python -m doomsday_watch "${ARGS[@]}" 2>&1 | tee -a run.log
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]; then
              break
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "::warning::Monitor exited ${rc}; retrying once in 20 seconds."
              sleep 20
            fi
          done

          echo "Run finished at $(date -u +%FT%TZ) with exit code ${rc}."
          # Exit codes: 0 = ok/partial coverage, 3 = every source externally
          # blocked (data preserved, degraded snapshot recorded), anything else
          # = monitor failure. Blocks are not caused by this repository, so keep
          # the hourly commit + deploy alive while surfacing a loud warning.
          if [ "$rc" -eq 3 ]; then
            echo "::warning::All sources were blocked this run. Previous listings are preserved; the dashboard is marked degraded with stale-data age."
            echo "degraded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"

      - name: Upload run log
        if: ${{ always() && steps.freshness.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log-${{ github.run_id }}
          path: run.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit snapshots, history and derived data
        if: ${{ inputs.dry_run != true && steps.freshness.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "doomsday-watch[bot]"
          git config user.email "doomsday-watch[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes this hour; no commit created."
            exit 0
          fi

          STATUS=$(python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("data/latest.json").read_text(encoding="utf-8"))
          totals = data.get("totals", {})
          status = data.get("status", "unknown")
          shows = totals.get("shows_total", 0)
          theatres = totals.get("theatres_with_listings", 0)
          print(f"{status}; {shows} shows; {theatres} theatres")
          PY
          )
          git commit -m "data: hourly snapshot -- ${STATUS}"

          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            if ! git rebase --autostash "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              echo "::error::Could not rebase onto origin/${TARGET_BRANCH}."
              exit 1
            fi
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "Pushed snapshot on attempt ${attempt}."
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the snapshot after 3 attempts."
          exit 1

      # Dry runs stop here: nothing is written, built or deployed.
      - name: Build dashboard
        if: ${{ inputs.dry_run != true && steps.freshness.outputs.skip != 'true' }}
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        if: ${{ inputs.dry_run != true && steps.freshness.outputs.skip != 'true' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ inputs.dry_run != true && steps.freshness.outputs.skip != 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        if: ${{ inputs.dry_run != true && steps.freshness.outputs.skip != 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4
