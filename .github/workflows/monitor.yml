name: Hourly ticket watch

on:
  schedule:
    # GitHub Actions cron is UTC and best-effort. 05:00 UTC = 10:30 IST; the
    # workflow then runs once per hour at :05 UTC (5 minutes past every IST hour,
    # since IST is UTC+05:30). Runs may start late during peak load.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check sources without writing snapshots or sending alerts"
        type: boolean
        default: false

# One shared group with pages.yml: monitoring writes data and deploys Pages, so
# two runs must never build/deploy at the same time. Queued, never cancelled.
concurrency:
  group: doomsday-watch-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TARGET_BRANCH: master

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 20
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install monitor dependencies
        run: pip install -r requirements.txt

      - name: Validate configuration
        run: python -m doomsday_watch --config config/monitor.json --data data validate
        env:
          PYTHONPATH: ${{ github.workspace }}/backend

      - name: Run hourly snapshot
        id: run
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DRY_RUN: ${{ inputs.dry_run }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          set -o pipefail
          # Actions invokes bash with -e; we need to inspect non-zero exit codes
          # (3 = every source externally blocked) instead of aborting immediately.
          set +e

          # Global options (--config/--data) come before the subcommand;
          # --dry-run/--github-summary belong to `run`.
          ARGS=(--config config/monitor.json --data data run)
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          ARGS+=(--github-summary)

          rc=1
          for attempt in 1 2; do
            echo "::group::Monitor attempt ${attempt}"
            python -m doomsday_watch "${ARGS[@]}" 2>&1 | tee -a run.log
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]; then
              break
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "::warning::Monitor exited ${rc}; retrying once in 20 seconds."
              sleep 20
            fi
          done

          echo "Run finished at $(date -u +%FT%TZ) with exit code ${rc}."
          # Exit codes: 0 = ok/partial coverage, 3 = every source externally
          # blocked (data preserved, degraded snapshot recorded), anything else
          # = monitor failure. Blocks are not caused by this repository, so keep
          # the hourly commit + deploy alive while surfacing a loud warning.
          if [ "$rc" -eq 3 ]; then
            echo "::warning::All sources were blocked this run. Previous listings are preserved; the dashboard is marked degraded with stale-data age."
            echo "degraded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log-${{ github.run_id }}
          path: run.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit snapshots, history and derived data
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          git config user.name "doomsday-watch[bot]"
          git config user.email "doomsday-watch[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes this hour; no commit created."
            exit 0
          fi

          STATUS=$(python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("data/latest.json").read_text(encoding="utf-8"))
          totals = data.get("totals", {})
          status = data.get("status", "unknown")
          shows = totals.get("shows_total", 0)
          theatres = totals.get("theatres_with_listings", 0)
          print(f"{status}; {shows} shows; {theatres} theatres")
          PY
          )
          git commit -m "data: hourly snapshot -- ${STATUS}"

          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            if ! git rebase --autostash "origin/$TARGET_BRANCH"; then
              git rebase --abort || true
              echo "::error::Could not rebase onto origin/${TARGET_BRANCH}."
              exit 1
            fi
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "Pushed snapshot on attempt ${attempt}."
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the snapshot after 3 attempts."
          exit 1

      # Dry runs stop here: nothing is written, built or deployed.
      - name: Build dashboard
        if: ${{ inputs.dry_run != true }}
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        if: ${{ inputs.dry_run != true }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        if: ${{ inputs.dry_run != true }}
        id: deployment
        uses: actions/deploy-pages@v4
