name: Hourly ticket watch

on:
  schedule:
    # GitHub Actions cron is UTC and best-effort. It can fire several minutes late.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check sources but do not write snapshots or notify"
        type: boolean
        default: false

# Never let two runs write the repository at the same time.
concurrency:
  group: doomsday-watch
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history is not needed; a shallow checkout keeps the run small.
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install monitor dependencies
        run: pip install -r requirements.txt

      - name: Validate configuration
        working-directory: backend
        run: python -m doomsday_watch --config ../config/monitor.json --data ../data validate

      - name: Run hourly snapshot
        id: run
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          set -o pipefail
          ARGS="--config ../config/monitor.json --data ../data"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m doomsday_watch $ARGS run --github-summary 2>&1 | tee run.log
          # The CLI exits 0 for partial coverage. A non-zero code means the run
          # itself failed, so keep the log for inspection.
          echo "Run finished at $(date -u +%FT%TZ)"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-log-${{ github.run_id }}
          path: backend/run.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit snapshots, history and derived data
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          git config user.name "doomsday-watch[bot]"
          git config user.email "doomsday-watch[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes this hour."
            exit 0
          fi
          STATUS=$(python - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/latest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          totals = data.get("totals", {})
          print(f"{data.get('status','unknown')}; {totals.get('shows_total',0)} shows; {totals.get('theatres_with_listings',0)} theatres")
          PY
          )
          git commit -m "data: hourly snapshot — ${STATUS}"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed snapshot on attempt ${attempt}."
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Could not push the snapshot after 3 attempts." >&2
          exit 1

      - name: Build dashboard
        if: ${{ inputs.dry_run != true }}
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Configure Pages
        if: ${{ inputs.dry_run != true }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        if: ${{ inputs.dry_run != true }}
        id: deployment
        uses: actions/deploy-pages@v4
