name: Source diagnostics (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe District and BookMyShow from this runner
        run: |
          URL="https://www.district.in/movies/avengers-doomsday-movie-tickets-in-bengaluru-MV176735"
          probe() {
            label="$1"; shift
            code=$(curl -sS --compressed -A "$1" "${@:2}" -o /tmp/body -w "%{http_code} %{size_download} %{remote_ip}" "$URL" || true)
            echo "== $label: $code"
            head -c 120 /tmp/body | tr '\n' ' '; echo
          }
          probe "plain-curl" "curl/8.5.0"
          probe "tracker-ua" "DoomsdayWatch/1.0 (+personal ticket-availability tracker)"
          probe "desktop-browser" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: en-IN,en;q=0.9"
          probe "mobile-browser" "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36" \
            -H "Accept-Language: en-IN,en;q=0.9"
          echo "== runner ip"; curl -sS https://api.ipify.org; echo
          echo "== district registry"; curl -sS --compressed -o /tmp/reg -w "%{http_code} %{size_download}\n" "https://www.district.in/movies/cinemas-in-bengaluru" -A "DoomsdayWatch/1.0"; head -c 120 /tmp/reg; echo
          echo "== bms"; curl -sS --compressed -o /tmp/bms -w "%{http_code} %{size_download}\n" "https://in.bookmyshow.com/explore/movies-bengaluru" -A "DoomsdayWatch/1.0"
