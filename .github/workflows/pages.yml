name: Deploy dashboard

# Deployment strategy:
#   * ingest.yml validates the NAS inbox, updates data with GITHUB_TOKEN, and
#     completes. GITHUB_TOKEN pushes do not trigger other workflows, so this
#     workflow also listens for that ingest completing.
#   * monitor.yml is a manual fallback that still deploys itself.
#   * human pushes that change the site or its config also deploy here.
# The inbox push itself is ignored; the generated data commit is what matters.
# All workflows share one concurrency group so Pages is never deployed twice.
on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "config/**"
      - "data/**"
      - "!data/inbox/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Ingest NAS snapshot"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: doomsday-watch-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
